<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        input {
            padding: 10px;
            width: 80%;
            margin: 10px;
        }

        button {
            padding: 10px;
            width: 85%;
            background: #007bff;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<h2>Login</h2>

<form method="POST">
    <input name="first_name" placeholder="First Name">
    <input name="password" type="password" placeholder="Password">
    <br>
    <button>Login</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}

<p>Don't have an account? <a href="/signup">Sign up</a></p>

</body>
</html>
