<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password — Church App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }
        h2 { margin-top: 0; color: #2c3e50; }
        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
            margin-bottom: 4px;
            font-size: 0.9em;
        }
        input {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
        .success {
            background: #eafaf1;
            border: 1px solid #27ae60;
            color: #27ae60;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .error {
            background: #fdecea;
            border: 1px solid #e74c3c;
            color: #c0392b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }
        .back {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #2c3e50;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>🔑 Forgot Password</h2>

    <p style="color:#555; font-size:0.95em;">
        Enter your first and last name. The superuser will be notified
        and will set a temporary password for you.
    </p>

    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if not success %}
    <form method="POST">
        <label>First Name</label>
        <input name="first_name" required placeholder="Your first name">

        <label>Last Name</label>
        <input name="last_name" required placeholder="Your last name">

        <button type="submit">Request Password Reset</button>
    </form>
    {% endif %}

    <a href="/login" class="back">← Back to Login</a>
</div>
</body>
</html>
